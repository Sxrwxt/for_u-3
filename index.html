<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for u</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            background-color: #F5F5F5;
            color: #000000;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        img.main-img {
            max-width: 90%;
            width: 450px;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
            border-radius: 12px;
        }

        /* ไฟ RGB กระพริบ */
        @keyframes rgbAnimation {
            0%   { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
            25%  { color: #00ff00; text-shadow: 0 0 15px #00ff00; }
            50%  { color: #00ffff; text-shadow: 0 0 15px #00ffff; }
            75%  { color: #ff00ff; text-shadow: 0 0 15px #ff00ff; }
            100% { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
        }

        .rgb-link {
            display: inline-block;
            font-size: 2.2rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            animation: rgbAnimation 1s infinite linear;
            margin-bottom: 25px;
        }

    </style>
</head>
<body>

    <h1>ควย</h1>
    
    <img src="super good.jpg" alt="รูปภาพ">
    
    <!-- ปุ่มข้อความไฟกระพริบ -->
    <a class="rgb-link" onclick="showBox()">
        กดแล้วโชกลับมา
    </a>

    <!-- กล่องคำถามสวยๆ แสดงด้านล่าง -->
    <div id="questionBox" class="question-card">
        <h2>คิดถึงโชอ่อ?</h2>
        <div class="btn-container">
            <button class="btn btn-yes" onclick="redirectPage('yes')">ใช่</button>
            <button class="btn btn-no" onclick="redirectPage('no')">ไม่ใช่</button>
        </div>
    </div>
    
    <!-- โครงสร้างป๊อปอัพแบบแสดงรูปพร้อมกากบาทมุมขวา -->
    <div id="popupModal" class="modal-overlay">
        <div class="modal-box">
            <!-- ปุ่มกากบาทมุมขวาบน -->
            <span class="close-btn" onclick="closePopup()">&times;</span>
            
            <!-- รูปภาพในป๊อปอัพ (ใช้นามสกุล/ชื่อเดียวกับรูปเดิมได้) -->
            <img src="Cho.jpg" alt="รูปป๊อปอัพ" class="modal-img">
            
            <h2>คุณแน่ใจหรือไม่ว่าอยากโชคดี?</h2>
            
            <div class="btn-container">
                <button class="btn btn-yes" onclick="window.location.assign('https://youtu.be/DjvwDCw6pl4?si=JEOh-tw1heNgUD9c')">ใช่</button>
                <button class="btn btn-no" onclick="window.location.assign('https://www.google.com')">ไม่ใช่</button>
            </div>
        </div>
    </div>

    <script>
        // แสดงกล่องคำถามด้านล่างเมื่อกดข้อความ RGB
        function showBox() {
            document.getElementById('questionBox').style.display = 'block';
            // สโครลหน้าจอลงมาที่กล่องคำถามให้อัตโนมัติ
            document.getElementById('questionBox').scrollIntoView({ behavior: 'smooth' });
        }

        // ย้ายหน้าเว็บตามคำตอบ
        function redirectPage(choice) {
            if (choice === 'yes') {
                // ลิงก์เมื่อกด "ใช่"
                window.location.href = "https://www.youtube.com/watch?si=JEOh-tw1heNgUD9c&v=DjvwDCw6pl4&feature=youtu.be";
            } else if (choice === 'no') {
                // ลิงก์เมื่อกด "ไม่ใช่"
                window.location.href = "https://youtu.be/tUuqWFExZgY?si=-EobV1gSg6oHFbGZ&t=190";
            }
        }
    </script>


</body>
</html>
