<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for u</title>
    <style>
        body {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        img {
            max-width: 90%;
            width: 450px;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        /* เอฟเฟกต์ไฟ RGB กระพริบ */
        @keyframes rgbAnimation {
            0%   { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
            25%  { color: #00ff00; text-shadow: 0 0 15px #00ff00; }
            50%  { color: #00ffff; text-shadow: 0 0 15px #00ffff; }
            75%  { color: #ff00ff; text-shadow: 0 0 15px #ff00ff; }
            100% { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
        }

        .rgb-link {
            display: inline-block;
            font-size: 2.2rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            animation: rgbAnimation 1s infinite linear;
            margin-bottom: 25px;
            transition: transform 0.2s;
        }

        .rgb-link:hover {
            transform: scale(1.05);
        }

        /* ตกแต่งกล่องคำถามด้านล่าง */
        .question-card {
            display: none; /* ซ่อนไว้ก่อน พอกดแล้วค่อยแสดง */
            max-width: 400px;
            margin: 0 auto;
            background: linear-gradient(145deg, #1e1e24, #2a2a32);
            padding: 25px 30px;
            border-radius: 16px;
            border: 2px solid #3a3a48;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 255, 255, 0.2);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .question-card h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #ffffff;
        }

        /* ตกแต่งปุ่ม ใช่ / ไม่ใช่ */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-yes {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }
        .btn-yes:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        .btn-no {
            background-color: #dc3545;
            color: white;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
        }
        .btn-no:hover {
            background-color: #c82333;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>ควย</h1>
    
    <img src="super-good.jpg" alt="รูปภาพ">
    
    <!-- ปุ่มข้อความไฟกระพริบ -->
    <a class="rgb-link" onclick="showBox()">
        กดแล้วโชกลับมา
    </a>

    <!-- กล่องคำถามสวยๆ แสดงด้านล่าง -->
    <div id="questionBox" class="question-card">
        <h2>คิดถึงโชอ่อ?</h2>
        <div class="btn-container">
            <button class="btn btn-yes" onclick="redirectPage('yes')">ใช่</button>
            <button class="btn btn-no" onclick="redirectPage('no')">ไม่ใช่</button>
        </div>
    </div>

    <script>
        // แสดงกล่องคำถามด้านล่างเมื่อกดข้อความ RGB
        function showBox() {
            document.getElementById('questionBox').style.display = 'block';
            // สโครลหน้าจอลงมาที่กล่องคำถามให้อัตโนมัติ
            document.getElementById('questionBox').scrollIntoView({ behavior: 'smooth' });
        }

        // ย้ายหน้าเว็บตามคำตอบ
        function redirectPage(choice) {
            if (choice === 'yes') {
                // ลิงก์เมื่อกด "ใช่"
                window.location.href = "https://www.youtube.com/watch?si=JEOh-tw1heNgUD9c&v=DjvwDCw6pl4&feature=youtu.be";
            } else if (choice === 'no') {
                // ลิงก์เมื่อกด "ไม่ใช่"
                window.location.href = "https://youtu.be/tUuqWFExZgY?si=Bey6GiM5XmKsKL2t";
            }
        }
    </script>

</body>
</html>
