<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for u</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            background-color: #F5F5F5;
            color: #000000;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        img.main-img {
            max-width: 90%;
            width: 450px;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
            border-radius: 12px;
        }

        /* ไฟ RGB กระพริบ */
        @keyframes rgbAnimation {
            0%   { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
            25%  { color: #00ff00; text-shadow: 0 0 15px #00ff00; }
            50%  { color: #00ffff; text-shadow: 0 0 15px #00ffff; }
            75%  { color: #ff00ff; text-shadow: 0 0 15px #ff00ff; }
            100% { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
        }

        .rgb-link {
            display: inline-block;
            font-size: 2.2rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            animation: rgbAnimation 1s infinite linear;
            margin-bottom: 25px;
        }

        /* พื้นหลังป๊อปอัพ (Overlay) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* กล่องป๊อปอัพ */
        .modal-box {
            position: relative;
            background-color: #1e1e24;
            padding: 25px;
            border-radius: 16px;
            border: 2px solid #3a3a48;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* ปุ่มกากบาทมุมขวาบน */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            color: #aaaaaa;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        .modal-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-yes { background-color: #28a745; color: white; }
        .btn-no { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <h1>ควย</h1>
    
    <img src="super good.jpg" alt="รูปภาพ" class="main-img">
    
    <!-- ปุ่มข้อความไฟกระพริบ (กดเพื่อเปิดป๊อปอัพซ้ำได้) -->
    <a class="rgb-link" onclick="openPopup()">
        กดแล้วโชกลับมา
    </a>

    <!-- โครงสร้างป๊อปอัพ -->
    <div id="popupModal" class="modal-overlay">
        <div class="modal-box">
            <!-- ปุ่มกากบาทมุมขวาบน -->
            <span class="close-btn" onclick="closePopup()">&times;</span>
            
            <!-- รูปภาพในป๊อปอัพ -->
            <img src="cho.jpg" alt="รูปป๊อปอัพ" class="modal-img">
            
            <h2>هل تفتقد مسلسل "شوغون" حقاً؟</h2>
            
            <div class="btn-container">
                <button class="btn btn-yes" onclick="window.location.assign('https://youtu.be/DjvwDCw6pl4?si=JEOh-tw1heNgUD9c')">ใช่</button>
                <button class="btn btn-no" onclick="window.location.assign('https://youtu.be/tUuqWFExZgY?si=qF85UYSTA9mcxpeD&t=191')">ไม่ใช่</button>
            </div>
        </div>
    </div>

    <script>
        function openPopup() {
            document.getElementById('popupModal').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('popupModal').style.display = 'none';
        }

        // ปิดป๊อปอัพเมื่อคลิกพื้นที่นอกกล่อง
        window.onclick = function(event) {
            var modal = document.getElementById('popupModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
        };
    </script>

</body>
</html>
