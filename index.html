<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for u</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            background-color: #F5F5F5;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #000000;
        }

        img {
            max-width: 90%;
            width: 450px;
            height: auto;
            display: block;
            margin: 0 auto 30px auto;
            border-radius: 12px;
        }

        @keyframes rgbAnimation {
            0%   { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
            25%  { color: #00ff00; text-shadow: 0 0 15px #00ff00; }
            50%  { color: #00ffff; text-shadow: 0 0 15px #00ffff; }
            75%  { color: #ff00ff; text-shadow: 0 0 15px #ff00ff; }
            100% { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
        }

        a.rgb-link, 
        a.rgb-link:visited, 
        a.rgb-link:hover, 
        a.rgb-link:active {
            display: inline-block;
            font-size: 2.2rem;
            font-weight: bold;
            text-decoration: none;
            animation: rgbAnimation 1s infinite linear !important;
        }
    </style>
</head>
<body>

    <h1>ควย</h1>
    
    <img src="super good.jpg">
    
    <a href="https://youtu.be/DjvwDCw6pl4?si=JEOh-tw1heNgUD9c" target="_blank" class="rgb-link">
        กดแล้วโชกลับมา
    </a>
<!-- ปุ่มป๊อบอัพ -->
    <a class="rgb-link" onclick="openQuestion()">กดแล้วโชกลับมา</a>

    <!-- โครงสร้าง Pop-up คำถาม -->
    <div id="questionModal" class="modal">
        <div class="modal-content">
            <h2 id="modalText">เอาดง เอาดี</h2>
            <div id="actionButtons">
                <button class="btn btn-yes" onclick="sendAnswer('yes')">ใช่</button>
                <button class="btn btn-no" onclick="sendAnswer('no')">ไม่</button>
            </div>
        </div>
    </div>

    <script>
        function openQuestion() {
            document.getElementById('questionModal').style.display = 'flex';
        }

        function sendAnswer(answer) {
            // ใส่ URL ของ Python Backend ที่เอาขึ้น Render ตรงนี้
            const backendUrl = "https://my-backend.onrender.com/check-answer";

            fetch(backendUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ choice: answer })
            })
            .then(response => response.json())
            .then(data => {
                // แสดงผลลัพธ์ที่ Python ส่งกลับมา
                document.getElementById('modalText').innerText = data.message;
                document.getElementById('actionButtons').style.display = 'none';
                
                // ปิดป๊อบอัพหลังแสดงผล 2 วินาที
                setTimeout(() => {
                    document.getElementById('questionModal').style.display = 'none';
                    document.getElementById('actionButtons').style.display = 'block';
                    document.getElementById('modalText').innerText = "เลิกฝันครับน้องโชไม่กลับมาหรอก";
                }, 2000);
            })
            .catch(error => {
                alert("ไม่สามารถเชื่อมต่อ Python Backend ได้");
            });
        }
    </script>
</body>
</html>
