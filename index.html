<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for u</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        img {
            max-width: 90%;
            width: 450px;
            height: auto;
            display: block;
            margin: 0 auto 30px auto;
            border-radius: 12px;
        }

        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background-color: #222;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #444;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .btn {
            padding: 12px 25px;
            margin: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        .btn-yes { background-color: #28a745; color: white; }
        .btn-no { background-color: #dc3545; color: white; }

        @keyframes rgbAnimation {
            0%   { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
            25%  { color: #00ff00; text-shadow: 0 0 15px #00ff00; }
            50%  { color: #00ffff; text-shadow: 0 0 15px #00ffff; }
            75%  { color: #ff00ff; text-shadow: 0 0 15px #ff00ff; }
            100% { color: #ff0000; text-shadow: 0 0 15px #ff0000; }
        }

        .rgb-link {
            display: inline-block;
            font-size: 2.2rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            animation: rgbAnimation 1s infinite linear;
        }
    </style>
</head>
<body>

    <h1>ควย</h1>
    
    <img src="super good.jpg">
    
    <a class="rgb-link" onclick="openModal()">
        กดแล้วโชกลับมา
    </a>

    <div id="questionModal" class="modal">
        <div class="modal-content">
            <h2>มั่นใจอ่ะอยากให้มันกลับมา?</h2>
            
            <button class="btn btn-yes" onclick="sendToPython('yes')">ใช่</button>
            <button class="btn btn-no" onclick="sendToPython('no')">ไม่ใช่</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('questionModal').style.display = 'flex';
        }

        function sendToPython(choice) {
            // ใส่ URL ของ Python API ที่ได้จาก Render ด้านล่างนี้
            const pythonApiUrl = "https://my-python-api.onrender.com/get-redirect-url";

            fetch(pythonApiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ choice: choice })
            })
            .then(response => response.json())
            .then(data => {
                // Python ส่ง URL ปลายทางกลับมา แล้วทำการย้ายหน้าเว็บ
                window.location.href = data.target_url;
            })
            .catch(error => {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อกับ Python Backend");
                console.error("Error:", error);
            });
        }
    </script>

</body>
</html>
